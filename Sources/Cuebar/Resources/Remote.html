<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cuebar Remote</title>
<style>
  :root {
    --bg: #08080a;
    --card: #16161a;
    --card-2: #1e1e23;
    --line: #2a2a31;
    --ink: #f2f2f5;
    --ink-dim: #9a9aa3;
    --ink-faint: #6a6a73;
    --accent: #ff8f4d;
    --on-accent: #14100c;
    --go: #4ade80;
    --idle: #fbbf24;
    --bad: #f87171;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.35 -apple-system, system-ui, "SF Pro Text", sans-serif;
    display: flex;
    justify-content: center;
    /* On a phone the controls belong at the top where the eye already is;
       on a wide window they would otherwise be a thin strip with a void
       under it, so the column is centred only when it isn't a phone. */
    align-items: flex-start;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  @media (min-width: 720px) { body { align-items: center; } }

  main {
    width: min(440px, 100%);
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px
             max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  @media (min-width: 720px) { main { min-height: 0; } }

  button {
    appearance: none; border: 0; border-radius: 16px;
    background: var(--card-2); color: var(--ink);
    font: 600 17px/1.1 -apple-system, system-ui, sans-serif;
    min-height: 60px; padding: 10px 12px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px;
    touch-action: manipulation;      /* no 300ms double-tap delay */
    transition: transform .06s ease, background .12s ease;
  }
  button:active { transform: scale(.975); background: #2b2b32; }
  button[disabled] { opacity: .3; }
  .cap {
    font-size: 11px; font-weight: 600; letter-spacing: .9px;
    text-transform: uppercase; color: var(--ink-dim);
  }

  /* ── header ─────────────────────────────────────────────── */
  header { display: flex; align-items: baseline; gap: 9px; padding: 2px 4px 0; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.2px;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  #status { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
  #sub { margin: 3px 4px 0; font-size: 14px; color: var(--ink-faint);
         display: flex; align-items: center; gap: 7px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);
         flex: none; }
  #dot.live   { background: var(--go); box-shadow: 0 0 0 3px rgb(74 222 128 / .15); }
  #dot.paused { background: var(--idle); box-shadow: 0 0 0 3px rgb(251 191 36 / .15); }
  #dot.off    { background: var(--bad); }
  #dot.wait   { background: var(--ink-faint); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ── position ───────────────────────────────────────────── */
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 18px; padding: 14px 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #section { font-size: 15px; font-weight: 600; color: var(--ink);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #section.none { color: var(--ink-faint); font-weight: 500; }
  #left { font-size: 15px; font-weight: 700; color: var(--accent);
          font-variant-numeric: tabular-nums; white-space: nowrap; }
  .times { margin-top: 7px; font-size: 12px; color: var(--ink-faint);
           font-variant-numeric: tabular-nums;
           display: flex; justify-content: space-between; }

  /* A 10px thumb on a 6-inch screen is a lottery; the track is thick and
     the thumb is 30px so a fumble still lands. */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; margin: 8px 0 0; background: transparent;
    touch-action: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, var(--accent) var(--pct, 0%),
                                var(--line) var(--pct, 0%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%; margin-top: -10px;
    background: #fff; border: 0;
    box-shadow: 0 2px 8px rgb(0 0 0 / .5);
  }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px;
                                        background: var(--line); }
  input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px;
                                           background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border: 0;
                                         border-radius: 50%; background: #fff; }
  input[type=range][disabled] { opacity: .35; }

  /* ── transport ───────────────────────────────────────────── */
  .transport { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; }
  .transport button { min-height: 92px; }
  .transport .glyph { font-size: 26px; line-height: 1; }
  /* Play is the button that gets pressed under pressure, so it is the only
     filled one, and its label is dark-on-orange — the earlier page put the
     muted grey label on the accent fill, which was unreadable. */
  #play { background: var(--accent); color: var(--on-accent); }
  #play:active { background: #ff7a2e; }
  #play .glyph { font-size: 30px; }
  #play .cap { color: rgb(20 16 12 / .68); }

  /* ── section pager ───────────────────────────────────────── */
  #pager { display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
           align-items: stretch; }
  #pager button { min-height: 52px; padding: 8px 16px; font-size: 15px; }
  #pagerName { display: flex; align-items: center; justify-content: center;
               min-width: 0; padding: 0 6px; font-size: 15px; font-weight: 600;
               color: var(--ink-dim); text-align: center;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── speed ──────────────────────────────────────────────── */
  .speed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card);
         border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .seg button { border-radius: 0; background: transparent; min-height: 56px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:active { background: var(--card-2); }

  /* Nudge is the control a presenter reaches for when they fumble a line:
     ±10 seconds of script, which is a couple of words at a reading pace and
     the whole line if you were quick. */
  .nudge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nudge button { min-height: 58px; font-size: 16px; }
  .nudge .glyph { font-size: 19px; letter-spacing: -1px; }

  /* Follow and mic are the two "something has gone wrong" recoveries. They
     show their state because a toggle you can't read is a coin toss, and
     the failure they fix — a prompter that won't scroll — is the one thing
     you cannot fix from the lectern. */
  .safety { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .safety button { min-height: 56px; font-size: 15px; background: var(--card);
                   border: 1px solid var(--line); }
  .safety .state { font-size: 12px; font-weight: 600; color: var(--ink-faint); }
  .safety button.on   { border-color: rgb(74 222 128 / .45); }
  .safety button.on .state { color: var(--go); }
  .safety button.bad  { border-color: rgb(248 113 113 / .5); background: rgb(248 113 113 / .1); }
  .safety button.bad .state { color: var(--bad); }
  .hint { font-size: 11px; color: var(--ink-faint); text-align: center;
          letter-spacing: .3px; margin-top: -4px; }

  .restart { min-height: 54px; background: transparent; border: 1px solid var(--line);
             color: var(--ink-dim); font-size: 15px; }

  footer { margin-top: auto; padding: 10px 4px 0; text-align: center;
           font-size: 11px; color: var(--ink-faint); letter-spacing: .3px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Cuebar</h1>
    <div class="spacer"></div>
    <div id="status">connecting</div>
  </header>
  <div id="sub"><span id="dot" class="wait"></span><span id="subText">connecting…</span></div>

  <section class="card">
    <div class="row">
      <span id="section" class="none">no sections</span>
      <span id="left">0:00 left</span>
    </div>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position">
    <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
  </section>

  <section class="transport">
    <button id="prevCue"><span class="glyph">‹</span><span class="cap">Back cue</span></button>
    <button id="play"><span class="glyph" id="playGlyph">▶</span><span class="cap" id="playCap">Play</span></button>
    <button id="nextCue"><span class="glyph">›</span><span class="cap">Next cue</span></button>
  </section>

  <section class="card" id="pagerCard" hidden>
    <div class="row" style="margin-bottom:8px"><span class="cap">Section</span>
      <span class="cap" id="sectionCount"></span></div>
    <div id="pager">
      <button id="prevSection">‹ Back</button>
      <span id="pagerName">—</span>
      <button id="nextSection">Next ›</button>
    </div>
  </section>

  <section class="card" id="slideCard" hidden>
    <div class="row" style="margin-bottom:8px">
      <span class="cap">Slide</span><span class="cap" id="slideState">—</span>
    </div>
    <div class="nudge">
      <button id="slideBack"><span class="glyph">‹</span><span class="cap">Back</span></button>
      <button id="slideFwd"><span class="glyph">›</span><span class="cap">Next</span></button>
    </div>
  </section>

  <section class="nudge">
    <button id="jumpBack"><span class="glyph">‹‹</span><span class="cap">10s back</span></button>
    <button id="jumpFwd"><span class="glyph">››</span><span class="cap">10s on</span></button>
  </section>

  <section class="speed">
    <div class="seg">
      <button id="slower"><span>−10</span><span class="cap">Slower</span></button>
      <button id="faster"><span>+10</span><span class="cap">Faster</span></button>
    </div>
  </section>
  <div class="hint">hold a speed button to trim by one</div>

  <section class="safety">
    <button id="follow"><span class="cap">Follow</span><span class="state" id="followState">—</span></button>
    <button id="mic"><span class="cap">Mic</span><span class="state" id="micState">—</span></button>
  </section>

  <div class="row">
    <span class="cap" id="rate">— wpm</span>
    <button class="restart" id="restart" style="width:auto;padding:0 18px;min-height:44px">↺ Restart</button>
  </div>

  <footer>Cuebar remote</footer>
</main>

<script>
  // The token is the whole authorisation, and it only ever exists in the
  // address the presenter typed. It is not in the Bonjour record, so a
  // device on the venue wifi can see that a Cuebar is here but cannot
  // drive it.
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  let state = null;
  let dragging = false;
  let failures = 0;

  const fmt = (seconds) => {
    const t = Math.max(0, Math.round(seconds || 0));
    const m = Math.floor(t / 60), s = t % 60;
    if (m >= 60) return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${m}:${String(s).padStart(2, '0')}`;
  };

  // A 403 and a dead socket are different problems and the presenter needs
  // to be told which: the first means the prompter went down and this
  // address is spent, the second means the phone left the network.
  class Stale extends Error {}

  // `text/plain` keeps this a "simple request": no preflight, no CORS
  // handshake, and nothing that would need a header to read.
  const send = async (payload) => {
    const response = await fetch(`/api/action?t=${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    if (response.status === 403) throw new Stale();
    const next = await response.json();
    if (next.error) throw new Error(next.error);
    return paint(next);
  };

  const offline = (text) => {
    $('dot').className = 'off';
    $('status').textContent = 'off';
    $('subText').textContent = text;
  };

  const paint = (s) => {
    state = s;
    failures = 0;
    const playing = s.isPlaying;
    $('title').textContent = s.title || 'Cuebar';
    $('dot').className = playing ? 'live' : 'paused';
    $('status').textContent = playing ? 'reading' : 'paused';
    $('subText').textContent = `${Math.round(s.wordsPerMinute)} words per minute · ${s.currentWord} of ${s.totalWords} words`;
    $('playGlyph').textContent = playing ? '❚❚' : '▶';
    $('playCap').textContent = playing ? 'Pause' : 'Play';
    $('left').textContent = `${fmt(s.remaining)} left`;
    $('elapsed').textContent = fmt(s.elapsed);
    $('total').textContent = fmt(s.elapsed + s.remaining);
    $('rate').textContent = `${Math.round(s.wordsPerMinute)} wpm`;

    // Slides: hidden entirely for a script with no `[slide]` cues, because a
    // stepper that says "slide 1" is a claim about a deck Cuebar has never
    // seen. The server sends nil, not 1, precisely so this can tell.
    const slide = s.slide;
    $('slideCard').hidden = (slide === null || slide === undefined);
    if (slide !== null && slide !== undefined) {
      // No "of N": the deck's length is the deck app's business, and a
      // confident "3 of 7" derived from a guess is worse than "3".
      $('slideState').textContent = `now ${slide}`;
      $('section').textContent = `slide ${slide}`;
    }

    $('followState').textContent = s.isFollowing ? 'on' : 'off';
    $('follow').className = s.isFollowing ? 'on' : 'bad';
    $('micState').textContent = s.isMicMuted ? 'muted' : 'live';
    $('mic').className = s.isMicMuted ? 'bad' : 'on';

    const total = s.totalWords;
    const pct = total ? (s.currentWord / total) * 100 : 0;
    const scrub = $('scrub');
    scrub.disabled = !total;
    if (!dragging) {
      scrub.value = Math.round(pct * 10);
      scrub.style.setProperty('--pct', `${pct}%`);
    }

    // A script with no headings has nothing to page through, so the pager
    // is not rendered at all — two dead grey buttons read as broken.
    const names = s.sections || [];
    $('pagerCard').hidden = names.length === 0;
    if (names.length) {
      const at = s.currentSection || '';
      $('section').textContent = at || 'before the first section';
      $('section').className = at ? '' : 'none';
      $('sectionCount').textContent = `${names.length}`;
      $('pagerName').textContent = at || '—';
      $('prevSection').disabled = !s.hasPreviousSection;
      $('nextSection').disabled = !s.hasNextSection;
    } else {
      $('section').textContent = 'no sections in this script';
      $('section').className = 'none';
    }
  };

  const act = (payload) => send(payload).catch((e) => {
    if (e instanceof Stale) offline('this address is spent — pop the prompter out for a new one');
    else offline("can't reach the Mac");
  });

  $('play').addEventListener('click', () => act({ action: 'playPause' }));
  $('prevCue').addEventListener('click', () => act({ action: 'previousCue' }));
  $('nextCue').addEventListener('click', () => act({ action: 'nextCue' }));
  $('slower').addEventListener('click', () => act({ action: 'speedDown' }));
  $('faster').addEventListener('click', () => act({ action: 'speedUp' }));
  $('restart').addEventListener('click', () => act({ action: 'restart' }));
  $('jumpBack').addEventListener('click', () => act({ action: 'jumpBack' }));
  $('jumpFwd').addEventListener('click', () => act({ action: 'jumpForward' }));
  $('slideBack').addEventListener('click', () => act({ action: 'previousSlide' }));
  $('slideFwd').addEventListener('click', () => act({ action: 'nextSlide' }));
  $('follow').addEventListener('click', () => act({ action: 'toggleFollow' }));
  $('mic').addEventListener('click', () => act({ action: 'toggleMicrophone' }));

  // Tap a speed button for a ±10 step; hold it to trim by one at a time.
  // Both halves are commands the app already has — the coarse step and the
  // fine one — so the gesture picks between them instead of the phone
  // inventing a rate of its own.
  const trim = (button, coarse, fine) => {
    let hold = null, repeat = null, trimmed = false;
    const stop = () => {
      clearTimeout(hold); clearInterval(repeat);
      if (!trimmed) act({ action: coarse });
    };
    button.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      trimmed = false;
      hold = setTimeout(() => {
        trimmed = true;
        act({ action: fine });
        repeat = setInterval(() => act({ action: fine }), 140);
      }, 420);
    });
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', () => {
      clearTimeout(hold); clearInterval(repeat);
    });
  };
  trim($('slower'), 'speedDown', 'fineSpeedDown');
  trim($('faster'), 'speedUp', 'fineSpeedUp');
  $('prevSection').addEventListener('click', () => act({ section: -1 }));
  $('nextSection').addEventListener('click', () => act({ section: 1 }));

  // The thumb moves under your finger while you drag, and the jump is sent
  // once on release — 40 fetches during one drag would stutter the Mac.
  const scrub = $('scrub');
  scrub.addEventListener('pointerdown', () => { dragging = true; });
  scrub.addEventListener('input', () => {
    const pct = scrub.value / 10;
    scrub.style.setProperty('--pct', `${pct}%`);
    if (state && state.totalWords) {
      $('section').textContent = `→ word ${Math.round(pct / 100 * state.totalWords)}`;
    }
  });
  const commit = () => {
    if (!dragging) return;
    dragging = false;
    act({ progress: scrub.value / 1000 });
  };
  scrub.addEventListener('pointerup', commit);
  scrub.addEventListener('pointercancel', commit);

  // A talk is minutes long and the phone is in a hand: the screen must not
  // sleep mid-sentence, and the poll must not run in a background tab
  // burning the venue wifi. Safari grants the lock lazily, so it is
  // re-requested every time the page comes back.
  const wake = async () => {
    try { await navigator.wakeLock?.request('screen'); } catch (_) {}
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { wake(); poll(); }
  });
  document.addEventListener('pointerdown', wake, { once: true });

  let timer = null;
  const poll = async () => {
    clearTimeout(timer);
    if (document.visibilityState !== 'visible') return;
    if (dragging) { timer = setTimeout(poll, 400); return; }
    try {
      const response = await fetch(`/api/state?t=${token}`);
      if (response.status === 403) throw new Stale();
      paint(await response.json());
    } catch (e) {
      failures += 1;
      offline(e instanceof Stale
        ? 'this address is spent — pop the prompter out for a new one'
        : "can't reach the Mac");
      // Back off, so a dead prompter doesn't get hammered at 2 Hz for the
      // rest of the talk.
      if (failures > 3) { $('dot').className = ''; }
    }
    const pace = failures ? Math.min(500 * failures, 4000) : (state?.isPlaying ? 600 : 1500);
    timer = setTimeout(poll, pace);
  };
  wake();
  poll();
</script>
</body>
</html>
